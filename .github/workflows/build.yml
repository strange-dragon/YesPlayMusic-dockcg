
name: Sync Upstream and Build Docker

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Force build Docker image"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: yesplaymusic-build
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync official source
        id: sync
        env:
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/qier222/YesPlayMusic.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git merge --no-edit upstream/master

            git push origin HEAD:master

            echo "Upstream synchronized."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Manual force build requested."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.sync.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.sync.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.sync.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yesplaymusic
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish Docker image
        if: steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
