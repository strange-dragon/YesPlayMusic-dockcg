name: Sync upstream and build Docker image

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build the image even when upstream has no new commits
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-build-image
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream and sync
        id: sync
        env:
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/qier222/YesPlayMusic.git
          git fetch upstream master

          changed=false
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork is already up to date with upstream."
          else
            changed=true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit -X theirs upstream/master
          fi

          # These upstream workflows are not part of this fork's Docker pipeline.
          rm -f .github/workflows/sync.yml .github/workflows/build.yaml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream and disable upstream workflows"
            git push origin HEAD:master
          elif [ "$changed" = true ]; then
            git push origin HEAD:master
          fi

          if [ "$changed" = true ] || [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch upstream Dockerfile for API dependency installation
        if: steps.sync.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          text = path.read_text()
          broken = 'npm i -g $(awk -F \\" \'{if($2=="@neteaseapireborn/api@latest") print $2"@"$4}\' /usr/local/lib/package.json)'
          fixed = 'API_VERSION=$(node -p "require(\'/usr/local/lib/package.json\').dependencies[\'@neteaseapireborn/api\']") \\\n  && npm i -g "@neteaseapireborn/api@$API_VERSION"'

          if broken in text:
              path.write_text(text.replace(broken, fixed, 1))
              print("Applied temporary fix for the upstream npm install command.")
          elif "npm i -g \"@neteaseapireborn/api@" in text or "npm i -g @neteaseapireborn/api@" in text:
              print("Upstream Dockerfile already contains a compatible API install command; no patch needed.")
          else:
              raise SystemExit("Unrecognized Dockerfile API install command; refusing to build an unpatched image.")
          PY

      - name: Set up Docker Buildx
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push image
        if: steps.sync.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
